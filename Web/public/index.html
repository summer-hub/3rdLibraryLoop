<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loop - 大模型健康检测</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            padding: 40px;
            width: 480px;
            max-width: 90vw;
        }
        h1 {
            font-size: 20px;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #86868b;
            font-size: 13px;
            margin-bottom: 28px;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #0071e3;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: #0077ed; }
        button:disabled { background: #d2d2d7; cursor: not-allowed; }
        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .result.ok   { background: #e8f8e8; border: 1px solid #b8e6b8; }
        .result.error{ background: #fde8e8; border: 1px solid #f5b8b8; }
        .result.loading { background: #fff4e0; border: 1px solid #ffd599; }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }
        .status-badge.ok    { background: #34c759; color: #fff; }
        .status-badge.error { background: #ff3b30; color: #fff; }
        .meta { color: #86868b; margin-top: 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AI Loop 系统</h1>
        <p class="subtitle">大模型 CLI 服务健康检测</p>

        <button id="checkBtn">检测大模型状态</button>

        <div id="result" class="result"></div>
    </div>

    <script>
        const btn = document.getElementById('checkBtn');
        const resultDiv = document.getElementById('result');

        async function checkHealth() {
            btn.disabled = true;
            btn.textContent = '检测中...';
            resultDiv.style.display = 'block';
            resultDiv.className = 'result loading';
            resultDiv.innerHTML = '正在连接后端检测服务...';

            try {
                // /api/health 经 Web 服务反向代理到后端 Server (同机回环)
                const resp = await fetch('/api/health');
                const data = await resp.json();

                const isOk = data.status === 'ok';
                const badgeClass = isOk ? 'ok' : 'error';
                const badgeText = isOk ? '正常' : '异常';

                resultDiv.className = `result ${isOk ? 'ok' : 'error'}`;
                resultDiv.innerHTML = `
                    <div>
                        <span class="status-badge ${badgeClass}">${badgeText}</span>
                        ${data.message || ''}
                    </div>
                    ${data.target ? `<div class="meta">目标: ${data.target}</div>` : ''}
                    ${data.timestamp ? `<div class="meta">时间: ${new Date(data.timestamp).toLocaleString('zh-CN')}</div>` : ''}
                `;
            } catch (err) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `请求失败: ${err.message}<br><span class="meta">请确认后端服务已启动</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '检测大模型状态';
            }
        }

        btn.addEventListener('click', checkHealth);
    </script>
</body>
</html>
