<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loop - 任务编排控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f0f0f5;
            --sidebar: #e8e8ed;
            --card: #ffffff;
            --border: #d2d2d7;
            --border-light: #e0e0e5;
            --text: #1d1d1f;
            --text2: #86868b;
            --text3: #aeaeb2;
            --blue: #0071e3;
            --blue-hover: #0077ed;
            --blue-light: #d4e5ff;
            --green: #34c759;
            --green-light: #d4f4dd;
            --red: #ff3b30;
            --red-light: #fde0e0;
            --orange: #ff9500;
            --orange-light: #fff0d4;
            --yellow: #ffd60a;
            --yellow-light: #fff9e0;
            --gray: #8e8e93;
            --gray-light: #e5e5ea;
            --purple: #af52de;
            --purple-light: #f0d4ff;
            --code-bg: #f5f5f7;
            --shadow: 0 1px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
        }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Header ─────────────────────────────── */
        .app-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
            height: 56px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 100;
        }
        .app-header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; }
        .app-header .nav-tabs { display: flex; gap: 6px; margin-left: auto; }
        .nav-tab {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.15s;
        }
        .nav-tab:hover { border-color: var(--blue); color: var(--blue); }
        .nav-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
        .health-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }
        .health-btn:hover { border-color: var(--blue); }
        .health-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .health-dot.ok { background: var(--green); }
        .health-dot.error { background: var(--red); }
        .health-dot.unknown { background: var(--text2); }

        /* ─── Layout ────────────────────────────── */
        .app-body {
            display: flex;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        /* ─── Sidebar ───────────────────────────── */
        .sidebar {
            width: 300px;
            min-width: 300px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .sidebar-header h2 { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header .count-badge {
            font-size: 11px;
            background: var(--gray);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .search-box {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }
        .search-box:focus { border-color: var(--blue); }
        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .task-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 4px;
            border: 2px solid transparent;
        }
        .task-item:hover { background: rgba(0,0,0,0.04); }
        .task-item.active { background: var(--card); border-color: var(--blue); box-shadow: var(--shadow); }
        .task-item .task-id { font-size: 12px; font-weight: 600; font-family: "SF Mono", Monaco, monospace; margin-bottom: 3px; }
        .task-item .task-desc { font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
        .task-item .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .task-item .task-time { font-size: 10px; color: var(--text3); }

        /* ─── Status Badges ─────────────────────── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 1px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }
        .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status-badge.idle { background: var(--gray-light); color: var(--gray); }
        .status-badge.idle::before { background: var(--gray); }
        .status-badge.loaded { background: var(--blue-light); color: var(--blue); }
        .status-badge.loaded::before { background: var(--blue); }
        .status-badge.running { background: var(--orange-light); color: var(--orange); }
        .status-badge.running::before { background: var(--orange); animation: pulse 1s infinite; }
        .status-badge.completed { background: var(--green-light); color: #1a7a31; }
        .status-badge.completed::before { background: var(--green); }
        .status-badge.failed, .status-badge.error { background: var(--red-light); color: #c41e1a; }
        .status-badge.failed::before, .status-badge.error::before { background: var(--red); }
        .status-badge.aborted { background: var(--gray-light); color: var(--gray); }
        .status-badge.aborted::before { background: var(--gray); }
        .status-badge.deadlocked { background: var(--red-light); color: #c41e1a; }
        .status-badge.deadlocked::before { background: var(--red); }
        .status-badge.pending { background: var(--gray-light); color: var(--gray); }
        .status-badge.pending::before { background: var(--gray); }
        .status-badge.ready { background: var(--blue-light); color: var(--blue); }
        .status-badge.ready::before { background: var(--blue); }
        .status-badge.skipped { background: var(--yellow-light); color: #b07d00; }
        .status-badge.skipped::before { background: var(--yellow); }
        .status-badge.blocked { background: var(--gray-light); color: var(--gray); }
        .status-badge.blocked::before { background: var(--gray); }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ─── Main Content ──────────────────────── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ─── Task Overview Bar ─────────────────── */
        .task-overview {
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .task-overview .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .task-overview .title-row h2 { font-size: 16px; font-family: "SF Mono", Monaco, monospace; }
        .task-overview .desc { font-size: 12px; color: var(--text2); margin-bottom: 8px; line-height: 1.5; }
        .task-overview .stats-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .stat-item { font-size: 11px; color: var(--text2); }
        .stat-item strong { color: var(--text); font-size: 13px; }
        .task-controls { display: flex; gap: 6px; margin-left: auto; }
        .task-controls button { padding: 5px 12px; font-size: 11px; }

        /* ─── Graph + Detail Split ──────────────── */
        .graph-detail-split {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ─── Graph Canvas ──────────────────────── */
        .graph-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }
        .graph-toolbar {
            padding: 8px 16px;
            background: var(--card);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .graph-toolbar h3 { font-size: 13px; }
        .graph-toolbar .toolbar-actions { margin-left: auto; display: flex; gap: 6px; }
        .graph-toolbar button { padding: 4px 10px; font-size: 11px; }
        .graph-canvas-wrap {
            flex: 1;
            overflow: auto;
            position: relative;
            background: var(--bg);
            background-image:
                radial-gradient(circle, #d2d2d7 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .graph-svg { display: block; min-width: 100%; min-height: 100%; }
        .graph-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text2);
            font-size: 14px;
        }

        /* ─── SVG Node Styles ───────────────────── */
        .node-group { cursor: pointer; transition: opacity 0.2s; }
        .node-group:hover .node-rect { stroke-width: 2.5; }
        .node-group.selected .node-rect { stroke: var(--blue); stroke-width: 3; }
        .node-rect { stroke: var(--border); stroke-width: 1.5; rx: 8; }
        .node-rect.pending { fill: #f5f5f7; stroke: var(--gray); }
        .node-rect.ready { fill: var(--blue-light); stroke: var(--blue); }
        .node-rect.running { fill: var(--orange-light); stroke: var(--orange); }
        .node-rect.completed { fill: var(--green-light); stroke: var(--green); }
        .node-rect.failed { fill: var(--red-light); stroke: var(--red); }
        .node-rect.skipped { fill: var(--yellow-light); stroke: var(--yellow); }
        .node-rect.blocked { fill: #e0e0e5; stroke: var(--gray); }
        .edge-line { fill: none; stroke: var(--text3); stroke-width: 1.5; }
        .edge-line.success { stroke: var(--green); stroke-width: 2; }
        .edge-line.fail { stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 5,3; }
        .edge-line.depend { stroke: var(--text3); stroke-width: 1; stroke-dasharray: 3,3; }
        .edge-label { font-size: 9px; fill: var(--text2); font-family: -apple-system; }
        .node-text { font-family: -apple-system; pointer-events: none; }
        .node-id { font-size: 13px; font-weight: 700; fill: var(--text); }
        .node-status { font-size: 9px; fill: var(--text2); }
        .node-retry { font-size: 9px; fill: var(--text2); }
        .running-ring { animation: dash 1s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -20; } }

        /* ─── Detail Panel ──────────────────────── */
        .detail-panel {
            width: 420px;
            min-width: 420px;
            background: var(--card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .detail-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .detail-tab {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text2);
            transition: all 0.15s;
        }
        .detail-tab:hover { color: var(--text); }
        .detail-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .detail-tab .tab-badge {
            font-size: 9px;
            background: var(--red);
            color: #fff;
            padding: 0 5px;
            border-radius: 8px;
            margin-left: 4px;
        }
        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .detail-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text2);
            font-size: 13px;
            text-align: center;
        }
        .detail-section { margin-bottom: 16px; }
        .detail-section h4 { font-size: 12px; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .kv-list { display: grid; grid-template-columns: 100px 1fr; gap: 4px 10px; font-size: 12px; }
        .kv-list .k { color: var(--text2); }
        .kv-list .v { font-family: "SF Mono", Monaco, monospace; word-break: break-all; }
        .detail-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .detail-actions button { padding: 6px 12px; font-size: 11px; }

        /* ─── Form Elements ─────────────────────── */
        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text2);
            margin-bottom: 3px;
        }
        input, textarea, select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border 0.15s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--blue); }
        textarea { resize: vertical; min-height: 50px; font-family: "SF Mono", Monaco, monospace; }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        button.primary { background: var(--blue); color: #fff; }
        button.primary:hover:not(:disabled) { background: var(--blue-hover); }
        button.success { background: var(--green); color: #fff; }
        button.success:hover:not(:disabled) { background: #2bb24c; }
        button.warn { background: var(--orange); color: #fff; }
        button.warn:hover:not(:disabled) { background: #e68400; }
        button.danger { background: var(--red); color: #fff; }
        button.danger:hover:not(:disabled) { background: #d62d20; }
        button.secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        button.secondary:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.sm { padding: 3px 8px; font-size: 10px; }

        /* ─── Message List ──────────────────────── */
        .msg-list { display: flex; flex-direction: column; gap: 6px; }
        .msg-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-item.user { background: var(--blue-light); }
        .msg-item.assistant { background: var(--green-light); }
        .msg-item.system { background: var(--gray-light); }
        .msg-item .role {
            font-weight: 700;
            margin-bottom: 3px;
            text-transform: uppercase;
            font-size: 9px;
            color: var(--text2);
        }
        .msg-item .time { font-size: 9px; color: var(--text3); margin-top: 3px; }
        .msg-item pre {
            font-family: "SF Mono", Monaco, monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 4px;
        }

        /* ─── History Records ───────────────────── */
        .history-list { display: flex; flex-direction: column; gap: 4px; }
        .history-item {
            padding: 6px 10px;
            background: var(--code-bg);
            border-radius: 5px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        /* ─── Modal ─────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            width: 900px;
            max-width: 95vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-header h3 { font-size: 15px; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text2); }
        .modal-body { flex: 1; overflow-y: auto; }
        .modal-body pre {
            font-family: "SF Mono", Monaco, monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ─── Toast ─────────────────────────────── */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.2s;
            max-width: 360px;
        }
        .toast.info { background: var(--blue); color: #fff; }
        .toast.success { background: var(--green); color: #fff; }
        .toast.error { background: var(--red); color: #fff; }
        .toast.warn { background: var(--orange); color: #fff; }
        @keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }

        /* ─── Misc ──────────────────────────────── */
        .muted { color: var(--text2); }
        .scrollbox { max-height: 200px; overflow-y: auto; }
        .divider { height: 1px; background: var(--border-light); margin: 12px 0; }
        .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .poll-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--green);
        }
        .poll-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1s infinite;
        }

        /* ─── New Task Button ──────────────────── */
        .new-task-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            padding: 7px 12px;
            margin-bottom: 8px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .new-task-btn:hover { background: var(--blue-hover); }

        /* ─── New Task Modal ───────────────────── */
        .new-task-modal { width: 640px; max-width: 95vw; }
        .new-task-modal .modal-body { padding: 0 4px; }
        .new-task-modal .form-group { margin-bottom: 14px; }
        .new-task-modal .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px;
        }
        .new-task-modal .form-group .hint {
            font-size: 11px;
            color: var(--text3);
            margin-top: 3px;
        }
        .new-task-modal textarea.large {
            min-height: 100px;
            font-size: 13px;
            line-height: 1.6;
        }
        .new-task-modal .advanced-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--blue);
            cursor: pointer;
            margin: 10px 0;
            user-select: none;
        }
        .new-task-modal .advanced-toggle::before {
            content: '▶';
            font-size: 9px;
            transition: transform 0.2s;
        }
        .new-task-modal .advanced-toggle.open::before {
            transform: rotate(90deg);
        }
        .new-task-modal .advanced-section {
            display: none;
            background: var(--code-bg);
            border-radius: 8px;
            padding: 12px;
        }
        .new-task-modal .advanced-section.show { display: block; }
        .new-task-modal .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            margin-top: 8px;
        }
        .new-task-modal .mode-toggle {
            display: flex;
            gap: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .new-task-modal .mode-toggle .mode-option {
            flex: 1;
            padding: 8px 12px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--card);
            color: var(--text2);
        }
        .new-task-modal .mode-toggle .mode-option.active {
            background: var(--blue);
            color: #fff;
        }
        .new-task-modal .mode-toggle .mode-option:not(:last-child) {
            border-right: 1px solid var(--border);
        }
        .new-task-modal .step-preview {
            background: var(--code-bg);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .new-task-modal .step-preview .preview-step {
            display: flex;
            gap: 10px;
            padding: 8px 10px;
            background: var(--card);
            border-radius: 5px;
            margin-bottom: 5px;
            font-size: 12px;
            align-items: flex-start;
        }
        .new-task-modal .step-preview .preview-step .step-num {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .new-task-modal .step-preview .preview-step .step-info { flex: 1; line-height: 1.5; }
        .new-task-modal .step-preview .preview-step .step-info .step-desc {
            color: var(--text);
            word-break: break-word;
        }
        .new-task-modal .step-preview .preview-step .step-info .step-meta {
            font-size: 10px;
            color: var(--text3);
            margin-top: 2px;
        }
        .new-task-modal .decomp-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 30px;
            font-size: 13px;
            color: var(--blue);
        }
        .new-task-modal .decomp-loading .spinner {
            width: 16px;

    </style>
</head>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
//  API Client
// ═══════════════════════════════════════════════════════════════════
const API = {
    async _fetch(url, opts) {
        const resp = await fetch(url, opts);
        return resp.json();
    },
    get(url) { return this._fetch(url); },
    post(url, body) {
        return this._fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    },
    del(url) { return this._fetch(url, { method: 'DELETE' }); }
};

// ═══════════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════════
const State = {
    tasks: [],
    filteredTasks: [],
    selectedTaskId: null,
    selectedStepId: null,
    currentProgress: null,
    activeTab: 'detail',
    sseSource: null,
    pollTimer: null,
    graphNodes: [],
    graphEdges: [],
    nodePositions: {},
};

// ═══════════════════════════════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════════════════════════════
function $(id) { return document.getElementById(id); }

function escapeHtml(text) {
    if (text == null) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

function truncate(str, len) {
    if (!str) return '';
    if (len === undefined) len = 50;
    return str.length > len ? str.substring(0, len) + '...' : str;
}

function formatTime(ts) {
    if (!ts) return '—';
    try {
        const d = new Date(ts);
        return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ts; }
}

function toast(level, msg, duration) {
    if (!duration) duration = 3000;
    const container = $('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + level;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(function() {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(function() { el.remove(); }, 300);
    }, duration);
}

function statusBadgeClass(status) {
    const map = {
        'idle': 'idle', 'loaded': 'loaded', 'running': 'running',
        'completed': 'completed', 'failed': 'failed', 'error': 'error',
        'aborted': 'aborted', 'deadlocked': 'deadlocked',
        'pending': 'pending', 'ready': 'ready', 'skipped': 'skipped', 'blocked': 'blocked'
    };
    return map[status] || 'idle';
}

function statusLabel(status) {
    const map = {
        'idle': '空闲', 'loaded': '已加载', 'running': '运行中',
        'completed': '已完成', 'failed': '失败', 'error': '错误',
        'aborted': '已终止', 'deadlocked': '死锁',
        'pending': '待执行', 'ready': '就绪', 'skipped': '已跳过', 'blocked': '已阻塞'
    };
    return map[status] || status;
}

// ═══════════════════════════════════════════════════════════════════
//  Health Check
// ═══════════════════════════════════════════════════════════════════
async function checkHealth() {
    const dot = $('healthDot');
    const text = $('healthText');
    dot.className = 'health-dot unknown';
    text.textContent = '检测中';
    try {
        const data = await API.get('/api/health');
        if (data.status === 'ok') {
            dot.className = 'health-dot ok';
            text.textContent = '服务正常';
        } else {
            dot.className = 'health-dot error';
            text.textContent = '服务异常';
        }
    } catch (err) {
        dot.className = 'health-dot error';
        text.textContent = '后端不可达';
    }
}

// ═══════════════════════════════════════════════════════════════════
//  Task List (Sidebar)
// ═══════════════════════════════════════════════════════════════════
async function loadTaskList() {
    try {
        const data = await API.get('/api/orchestrator/tasks');
        if (data.status === 'ok') {
            State.tasks = data.tasks || [];
            filterTasks();
        }
    } catch (err) {
        $('taskList').innerHTML = '<div class="detail-empty">加载失败: ' + escapeHtml(err.message) + '</div>';
    }
}

function filterTasks() {
    const q = $('taskSearch').value.trim().toLowerCase();
    State.filteredTasks = State.tasks.filter(function(t) {
        const id = (t.taskId || '').toLowerCase();
        const desc = (t.taskDescription || t.error || '').toLowerCase();
        return !q || id.indexOf(q) !== -1 || desc.indexOf(q) !== -1;
    });
    renderTaskList();
}

function renderTaskList() {
    const list = $('taskList');
    $('taskCount').textContent = State.filteredTasks.length;
    if (State.filteredTasks.length === 0) {
        list.innerHTML = '<div class="detail-empty">暂无任务</div>';
        return;
    }
    list.innerHTML = State.filteredTasks.map(function(t) {
        const stats = t.stats || {};
        const total = stats.total || (t.steps ? t.steps.length : 0) || 0;
        const completed = stats.completed || 0;
        const status = t.status || 'idle';
        const isActive = t.taskId === State.selectedTaskId;
        const time = t.startTime || t.endTime || '';
        return '<div class="task-item ' + (isActive ? 'active' : '') + '" onclick="selectTask(\'' + escapeHtml(t.taskId) + '\')">' +
            '<div class="task-id">' + escapeHtml(t.taskId) + '</div>' +
            '<div class="task-desc">' + escapeHtml(truncate(t.taskDescription || t.error || '无描述', 40)) + '</div>' +
            '<div class="task-meta">' +
                '<span class="status-badge ' + statusBadgeClass(status) + '">' + statusLabel(status) + '</span>' +
                (total ? '<span class="task-time">' + completed + '/' + total + ' 步骤</span>' : '') +
                (time ? '<span class="task-time">' + formatTime(time) + '</span>' : '') +
            '</div>' +
        '</div>';
    }).join('');
}

async function selectTask(taskId) {
    State.selectedTaskId = taskId;
    State.selectedStepId = null;
    stopPolling();
    renderTaskList();
    await loadTaskProgress(taskId);
    connectSSE(taskId);
}

// ═══════════════════════════════════════════════════════════════════
//  Task Progress & Overview
// ═══════════════════════════════════════════════════════════════════
async function loadTaskProgress(taskId) {
    try {
        const data = await API.get('/api/orchestrator/progress?taskId=' + encodeURIComponent(taskId));
        if (data.status === 'ok' && data.progress) {
            State.currentProgress = data.progress;
            renderTaskOverview();
            renderGraph();
            renderDetailPanel();
        } else {
            toast('error', '加载进度失败: ' + (data.error || '未知错误'));
        }
    } catch (err) {
        toast('error', '请求失败: ' + err.message);
    }
}

function renderTaskOverview() {
    const p = State.currentProgress;
    if (!p) return;
    $('taskOverview').style.display = 'block';
    $('ovTaskId').textContent = p.taskId;
    const statusEl = $('ovStatus');
    statusEl.className = 'status-badge ' + statusBadgeClass(p.status);
    statusEl.textContent = statusLabel(p.status);

    const firstStep = p.steps && p.steps[0];
    $('ovDesc').textContent = firstStep ? truncate(firstStep.taskDescription, 200) : '—';

    const s = p.stats || {};
    const total = s.total || (p.steps ? p.steps.length : 0) || 0;
    $('ovStats').innerHTML =
        '<div class="stat-item">总步骤: <strong>' + total + '</strong></div>' +
        '<div class="stat-item">✅ <strong>' + (s.completed || 0) + '</strong></div>' +
        '<div class="stat-item">🔄 <strong>' + (s.running || 0) + '</strong></div>' +
        '<div class="stat-item">⏳ <strong>' + (s.ready || 0) + '</strong></div>' +
        '<div class="stat-item">❌ <strong>' + (s.failed || 0) + '</strong></div>' +
        '<div class="stat-item">⏸ <strong>' + (s.pending || 0) + '</strong></div>' +
        '<div class="stat-item">全局执行: <strong>' + (p.globalExecCount || 0) + '</strong></div>' +
        (p.startTime ? '<div class="stat-item">开始: <strong>' + formatTime(p.startTime) + '</strong></div>' : '') +
        (p.error ? '<div class="stat-item" style="color:var(--red);">错误: <strong>' + escapeHtml(p.error) + '</strong></div>' : '');

    const isRunning = p.status === 'running';
    const isLoaded = p.status === 'loaded' || p.status === 'idle';
    const isFinished = p.status === 'completed' || p.status === 'failed' || p.status === 'aborted' || p.status === 'deadlocked';
    $('btnOrchStart').disabled = !isLoaded;
    $('btnOrchPause').disabled = !isRunning;
    $('btnOrchResume').disabled = isRunning || isFinished;
    $('btnOrchAbort').disabled = isFinished;
}

// ═══════════════════════════════════════════════════════════════════
//  Graph Renderer (SVG DAG)
// ═══════════════════════════════════════════════════════════════════
function buildGraphData() {
    const p = State.currentProgress;
    if (!p || !p.steps || p.steps.length === 0) {
        State.graphNodes = [];
        State.graphEdges = [];
        return;
    }
    State.graphNodes = p.steps.map(function(s) {
        return {
            id: String(s.stepId),
            stepId: s.stepId,
            status: s.status || 'pending',
            retryCount: s.retryCount || 0,
            maxRetries: s.maxRetries || 5,
            taskDescription: s.taskDescription || '',
            dependId: String(s.dependId || '0'),
            nextStepId: String(s.nextStepId || '0'),
            failStepId: String(s.failStepId || '0'),
            sessionId: s.sessionId || '',
            resultPath: s.resultPath || '',
            error: s.error || '',
            startTime: s.startTime,
            endTime: s.endTime,
            history: s.history || [],
        };
    });

    State.graphEdges = [];
    const nodeIds = {};
    State.graphNodes.forEach(function(n) { nodeIds[n.id] = true; });
    State.graphNodes.forEach(function(n) {
        if (n.dependId && n.dependId !== '0' && nodeIds[n.dependId]) {
            State.graphEdges.push({ from: n.dependId, to: n.id, type: 'depend', label: '依赖' });
        }
        if (n.nextStepId && n.nextStepId !== '0' && nodeIds[n.nextStepId]) {
            State.graphEdges.push({ from: n.id, to: n.nextStepId, type: 'success', label: '成功' });
        }
        if (n.failStepId && n.failStepId !== '0' && nodeIds[n.failStepId]) {
            State.graphEdges.push({ from: n.id, to: n.failStepId, type: 'fail', label: '失败' });
        }
    });
}

function layoutGraph() {
    const nodes = State.graphNodes;
    if (nodes.length === 0) { State.nodePositions = {}; return; }

    const nodeMap = {};
    nodes.forEach(function(n) { nodeMap[n.id] = n; });

    const levels = {};
    function getLevel(id, visited) {
        if (!visited) visited = {};
        if (visited[id]) return 0;
        if (levels[id] !== undefined) return levels[id];
        const node = nodeMap[id];
        if (!node) return 0;
        visited[id] = true;
        if (!node.dependId || node.dependId === '0' || !nodeMap[node.dependId]) {
            levels[id] = 0;
            return 0;
        }
        const lvl = getLevel(node.dependId, visited) + 1;
        levels[id] = lvl;
        return lvl;
    }
    nodes.forEach(function(n) { getLevel(n.id, {}); });

    let changed = true;
    let iterations = 0;
    while (changed && iterations < 10) {
        changed = false;
        iterations++;
        nodes.forEach(function(n) {
            if (n.nextStepId && n.nextStepId !== '0' && nodeMap[n.nextStepId]) {
                const expected = (levels[n.id] || 0) + 1;
                if ((levels[n.nextStepId] || 0) < expected) {
                    levels[n.nextStepId] = expected;
                    changed = true;
                }
            }
        });
    }

    let maxLevel = 0;
    for (const key in levels) {
        if (levels[key] > maxLevel) maxLevel = levels[key];
    }

    const levelGroups = {};
    for (let i = 0; i <= maxLevel; i++) levelGroups[i] = [];
    nodes.forEach(function(n) {
        const lvl = levels[n.id] || 0;
        if (!levelGroups[lvl]) levelGroups[lvl] = [];
        levelGroups[lvl].push(n);
    });

    const NODE_W = 180;
    const NODE_H = 80;
    const GAP_X = 60;
    const GAP_Y = 80;
    const PAD = 40;

    State.nodePositions = {};
    for (let lvl = 0; lvl <= maxLevel; lvl++) {
        const group = levelGroups[lvl] || [];
        group.forEach(function(n, idx) {
            State.nodePositions[n.id] = {
                x: PAD + idx * (NODE_W + GAP_X),
                y: PAD + lvl * (NODE_H + GAP_Y),
                w: NODE_W,
                h: NODE_H,
                cx: PAD + idx * (NODE_W + GAP_X) + NODE_W / 2,
                cy: PAD + lvl * (NODE_H + GAP_Y) + NODE_H / 2,
            };
        });
    }
}

function renderGraph() {
    buildGraphData();
    layoutGraph();

    const svg = $('graphSvg');
    const empty = $('graphEmpty');

    if (State.graphNodes.length === 0) {
        svg.style.display = 'none';
        empty.style.display = 'flex';
        $('graphHint').textContent = '';
        return;
    }

    svg.style.display = 'block';
    empty.style.display = 'none';

    let maxX = 0, maxY = 0;
    for (const id in State.nodePositions) {
        const p = State.nodePositions[id];
        if (p.x + p.w > maxX) maxX = p.x + p.w;
        if (p.y + p.h > maxY) maxY = p.y + p.h;
    }
    const width = maxX + 60;
    const height = maxY + 60;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);

    let svgContent = '';

    // Draw edges
    State.graphEdges.forEach(function(edge) {
        const from = State.nodePositions[edge.from];
        const to = State.nodePositions[edge.to];
        if (!from || !to) return;

        const x1 = from.cx;
        const y1 = from.y + from.h;
        const x2 = to.cx;
        const y2 = to.y;

        const dy = y2 - y1;
        const midY = y1 + dy / 2;
        const path = 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + midY + ', ' + x2 + ' ' + midY + ', ' + x2 + ' ' + y2;

        const cls = edge.type === 'success' ? 'success' : edge.type === 'fail' ? 'fail' : 'depend';
        const strokeColor = edge.type === 'success' ? '#34c759' : edge.type === 'fail' ? '#ff3b30' : '#aeaeb2';
        svgContent += '<path class="edge-line ' + cls + '" d="' + path + '" />';

        const arrowSize = 6;
        svgContent += '<polygon points="' + x2 + ',' + y2 + ' ' + (x2 - arrowSize/2) + ',' + (y2 - arrowSize) + ' ' + (x2 + arrowSize/2) + ',' + (y2 - arrowSize) + '" fill="' + strokeColor + '" />';

        const labelX = (x1 + x2) / 2;
        const labelY = midY - 3;
        svgContent += '<text class="edge-label" x="' + labelX + '" y="' + labelY + '" text-anchor="middle">' + escapeHtml(edge.label) + '</text>';
    });

    // Draw nodes
    State.graphNodes.forEach(function(node) {
        const pos = State.nodePositions[node.id];
        if (!pos) return;
        const isSelected = String(State.selectedStepId) === node.id;
        const statusClass = node.status || 'pending';
        const retryText = node.retryCount > 0 ? '🔄 ' + node.retryCount + '/' + node.maxRetries : '';

        svgContent += '<g class="node-group ' + (isSelected ? 'selected' : '') + '" onclick="selectStep(\'' + escapeHtml(node.id) + '\')">';
        svgContent += '<rect class="node-rect ' + statusClass + '" x="' + pos.x + '" y="' + pos.y + '" width="' + pos.w + '" height="' + pos.h + '" rx="8" />';
        if (statusClass === 'running') {
            svgContent += '<rect class="running-ring" x="' + pos.x + '" y="' + pos.y + '" width="' + pos.w + '" height="' + pos.h + '" rx="8" fill="none" stroke="#ff9500" stroke-width="2.5" stroke-dasharray="8,4" />';
        }
        svgContent += '<text class="node-text node-id" x="' + (pos.x + 10) + '" y="' + (pos.y + 22) + '">步骤 ' + escapeHtml(node.stepId) + '</text>';
        svgContent += '<text class="node-text node-status" x="' + (pos.x + 10) + '" y="' + (pos.y + 38) + '">' + statusLabel(node.status) + '</text>';
        if (retryText) {
            svgContent += '<text class="node-text node-retry" x="' + (pos.x + 10) + '" y="' + (pos.y + 52) + '">' + retryText + '</text>';
        }
        const shortDesc = truncate(node.taskDescription, 18);
        svgContent += '<text class="node-text node-retry" x="' + (pos.x + 10) + '" y="' + (pos.y + 68) + '">' + escapeHtml(shortDesc) + '</text>';
        svgContent += '</g>';
    });

    svg.innerHTML = svgContent;
    $('graphHint').textContent = State.graphNodes.length + ' 个步骤, ' + State.graphEdges.length + ' 条关系';
}

function fitGraph() {
    const canvas = $('graphCanvas');
    canvas.scrollLeft = 0;
    canvas.scrollTop = 0;
}

// ═══════════════════════════════════════════════════════════════════
//  Step Selection & Detail Panel
// ═══════════════════════════════════════════════════════════════════
function selectStep(stepId) {
    State.selectedStepId = stepId;
    renderGraph();
    renderDetailPanel();
}

function getCurrentStep() {
    if (!State.currentProgress || !State.selectedStepId) return null;
    return State.currentProgress.steps.find(function(s) {
        return String(s.stepId) === String(State.selectedStepId);
    });
}

function renderDetailPanel() {
    const step = getCurrentStep();
    if (!step) {
        $('detailContent').innerHTML = '<div class="detail-empty">请选择一个步骤节点</div>';
        return;
    }
    switch (State.activeTab) {
        case 'detail': renderDetailTab(step); break;
        case 'conversation': renderConversationTab(step); break;
        case 'control': renderControlTab(step); break;
        case 'edit': renderEditTab(step); break;
        case 'files': renderFilesTab(step); break;
    }
}

// ── Detail Tab ──

                '<div class="k">开始时间</div><div class="v">' + formatTime(step.startTime) + '</div>' +
                '<div class="k">结束时间</div><div class="v">' + formatTime(step.endTime) + '</div>' +

        '<div class="detail-section">' +
            '<h4>步骤关系</h4>' +
            '<div class="kv-list">' +
                '<div class="k">依赖步骤</div><div class="v">' + (step.dependId && step.dependId !== '0' ? '步骤 ' + escapeHtml(step.dependId) : '无 (入口)') + '</div>' +
                '<div class="k">成功→下一步</div><div class="v">' + (step.nextStepId && step.nextStepId !== '0' ? '步骤 ' + escapeHtml(step.nextStepId) : '无 (结束)') + '</div>' +
                '<div class="k">失败→回退</div><div class="v">' + (step.failStepId && step.failStepId !== '0' ? '步骤 ' + escapeHtml(step.failStepId) : '无 (终止)') + '</div>' +

// ── Conversation Tab ──
async function renderConversationTab(step) {
    const taskId = State.selectedTaskId;
    const stepId = step.stepId;
    $('detailContent').innerHTML =
        '<div class="detail-section">' +
            '<h4>会话交互</h4>' +
            '<div class="form-group">' +
                '<textarea id="convInput" placeholder="输入要发送的消息或注入的提示词..." style="min-height:60px;"></textarea>' +
            '</div>' +
            '<div class="detail-actions">' +
                '<button class="secondary sm" id="btnInject">📥 注入提示词</button>' +
                '<button class="primary sm" id="btnSendWait">📨 发送并等待</button>' +
            '</div>' +
        '</div>' +
        '<div class="detail-section">' +
            '<h4>消息列表 <span id="convPollIndicator" style="display:none;" class="poll-indicator">轮询中</span></h4>' +
            '<div class="detail-actions" style="margin-bottom:8px;">' +
                '<button class="secondary sm" id="btnGetLive">获取实时消息</button>' +

                '<button class="secondary sm" id="btnTogglePoll">自动轮询</button>' +

    $('btnGetSession').onclick = function() { getSessionArchive(taskId, stepId); };
    $('btnTogglePoll').onclick = function() { togglePoll(taskId, stepId); };

    getLiveMsgs(taskId, stepId);
}

async function getLiveMsgs(taskId, stepId) {
    try {
        const data = await API.get('/api/flexrunner/live-messages?taskId=' + encodeURIComponent(taskId) + '&stepId=' + encodeURIComponent(stepId));
        if (data.status === 'ok') {
            renderMessages(data.messages || []);
        }
    } catch (err) { toast('error', '获取消息失败: ' + err.message); }
}

async function getSessionArchive(taskId, stepId) {
    try {
        const data = await API.get('/api/flexrunner/session?taskId=' + encodeURIComponent(taskId) + '&stepId=' + encodeURIComponent(stepId));
        if (data.status === 'ok') {
            renderMessages(data.messages || []);
            toast('info', '会话归档: ' + (data.messages || []).length + ' 条消息');
        }
    } catch (err) { toast('error', '获取归档失败: ' + err.message); }
}

async function injectPromptMsg(taskId, stepId) {
    const msg = $('convInput').value.trim();
    if (!msg) { toast('warn', '请先输入消息'); return; }
    try {
        const data = await API.post('/api/flexrunner/inject-prompt', { taskId: taskId, stepId: stepId, message: msg });
        if (data.status === 'ok') {
            toast('success', '提示词已注入');
            $('convInput').value = '';
            getLiveMsgs(taskId, stepId);
        } else {
            toast('warn', data.message || '注入失败');
        }
    } catch (err) { toast('error', '请求失败: ' + err.message); }
}

async function sendAndWaitMsg(taskId, stepId) {
    const msg = $('convInput').value.trim();
    if (!msg) { toast('warn', '请先输入消息'); return; }
    const btn = $('btnSendWait');
    btn.disabled = true;
    btn.textContent = '⏳ 等待中...';
    try {
        const data = await API.post('/api/flexrunner/send-and-wait', { taskId: taskId, stepId: stepId, message: msg });
        if (data.status === 'ok') {
            toast('success', '已收到回复');
            $('convInput').value = '';
            getLiveMsgs(taskId, stepId);
        } else {
            toast('warn', data.message || '发送失败');
        }
    } catch (err) {
        toast('error', '请求失败: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '📨 发送并等待';
    }
}

function togglePoll(taskId, stepId) {
    const btn = $('btnTogglePoll');
    const indicator = $('convPollIndicator');
    if (State.pollTimer) {
        stopPolling();
        btn.textContent = '自动轮询';
        btn.classList.remove('danger');
        btn.classList.add('secondary');
        indicator.style.display = 'none';
    } else {
        btn.textContent = '停止轮询';
        btn.classList.remove('secondary');
        btn.classList.add('danger');
        indicator.style.display = 'inline-flex';
        getLiveMsgs(taskId, stepId);
        State.pollTimer = setInterval(function() { getLiveMsgs(taskId, stepId); }, 3000);
    }
}

function stopPolling() {
    if (State.pollTimer) {
        clearInterval(State.pollTimer);
        State.pollTimer = null;
        const btn = $('btnTogglePoll');
        if (btn) {
            btn.textContent = '自动轮询';
            btn.classList.remove('danger');
            btn.classList.add('secondary');
        }
        const indicator = $('convPollIndicator');
        if (indicator) indicator.style.display = 'none';
    }
}

function renderMessages(messages) {
    const list = $('msgList');
    if (!list) return;
    if (!messages || messages.length === 0) {
        list.innerHTML = '<div class="muted" style="font-size:12px;">暂无消息</div>';
        return;
    }
    list.innerHTML = messages.map(function(msg) {
        const role = msg.role || (msg.info && msg.info.role) || 'unknown';
        const content = msg.content || (msg.parts && msg.parts[0] && msg.parts[0].text) || JSON.stringify(msg);
        const time = msg.timestamp || '';
        const roleClass = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'system';
        return '<div class="msg-item ' + roleClass + '">' +
            '<div class="role">' + escapeHtml(role) + '</div>' +
            '<div>' + escapeHtml(content) + '</div>' +
            (time ? '<div class="time">' + escapeHtml(time) + '</div>' : '') +
        '</div>';
    }).join('');
}

// ── Control Tab ──
function renderControlTab(step) {

    $('detailContent').innerHTML =

                '<div class="k">任务</div><div class="v">' + escapeHtml(taskId) + '</div>' +

            '</div>' +
            '<div class="detail-actions">' +
                '<button class="primary" id="btnExec" ' + (canExecute ? '' : 'disabled') + '>▶ 执行单次</button>' +
                '<button class="success" id="btnExecLoop" ' + (canExecute ? '' : 'disabled') + '>🔁 自动循环</button>' +
            '</div>' +

                '<button class="warn" id="btnPause" ' + (isRunning ? '' : 'disabled') + '>⏸ 暂停</button>' +
                '<button class="secondary" id="btnResume" ' + (isRunning ? '' : 'disabled') + '>▶ 继续</button>' +
                '<button class="danger" id="btnAbort" ' + (isRunning ? '' : 'disabled') + '>⏹ 终止</button>' +
            '</div>' +
            '<div class="detail-actions" style="margin-top:6px;">' +
                '<button class="secondary" id="btnCheckRes">📋 检查结果</button>' +
                '<button class="secondary" id="btnRefreshRunner">🔄 刷新状态</button>' +
            '</div>' +
        '</div>' +
        '<div class="detail-section">' +
            '<h4>执行输出</h4>' +
            '<div class="msg-list" id="controlOutput" style="font-family:\'SF Mono\',Monaco,monospace;font-size:11px;background:var(--code-bg);padding:10px;border-radius:6px;min-height:60px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;">等待操作...</div>' +

    $('btnExecLoop').onclick = function() { execLoop(taskId, stepId); };
    $('btnPause').onclick = function() { runnerControl(taskId, stepId, 'pause'); };
    $('btnResume').onclick = function() { runnerControl(taskId, stepId, 'resume'); };
    $('btnAbort').onclick = function() { runnerControl(taskId, stepId, 'abort'); };
    $('btnCheckRes').onclick = function() { checkResultFile(taskId, stepId); };
    $('btnRefreshRunner').onclick = function() { refreshRunnerStatus(taskId, stepId); };
}

function logControl(msg) {
    const out = $('controlOutput');
    if (!out) return;
    if (out.textContent === '等待操作...') out.textContent = '';
    const time = new Date().toLocaleTimeString('zh-CN');
    out.textContent += '[' + time + '] ' + msg + '\n';
    out.scrollTop = out.scrollHeight;
}

async function execSingle(taskId, stepId) {
    logControl('执行单次...');
    try {
        const data = await API.post('/api/flexrunner/execute', { taskId: taskId, stepId: stepId });
        if (data.status === 'ok') {
            const r = data.result;
            logControl('完成: success=' + r.success + ', nextStepId=' + (r.nextStepId || '(结束)'));
            toast(r.success ? 'success' : 'warn', '执行' + (r.success ? '成功' : '失败'));
        } else {
            logControl('失败: ' + (data.error || JSON.stringify(data)));
            toast('error', '执行失败');
        }
        await loadTaskProgress(taskId);
    } catch (err) { logControl('请求失败: ' + err.message); toast('error', err.message); }
}

async function execLoop(taskId, stepId) {
    logControl('开始自动循环...');
    try {
        const data = await API.post('/api/flexrunner/execute-loop', { taskId: taskId, stepId: stepId });
        if (data.results) {
            data.results.forEach(function(r) { logControl('第' + r.attempt + '次: success=' + r.success); });
        }
        logControl('循环结束: 共' + data.totalAttempts + '次, 最终=' + (data.finalResult ? data.finalResult.success : '?'));
        toast(data.finalResult && data.finalResult.success ? 'success' : 'error', '循环结束: ' + data.totalAttempts + '次');
        await loadTaskProgress(taskId);
    } catch (err) { logControl('请求失败: ' + err.message); toast('error', err.message); }
}

async function runnerControl(taskId, stepId, type) {
    logControl('控制: ' + type);
    try {
        const data = await API.post('/api/flexrunner/control', { taskId: taskId, stepId: stepId, type: type });
        logControl(type + ': ' + data.message);
        toast(data.status === 'ok' ? 'success' : 'warn', data.message);
        await loadTaskProgress(taskId);
    } catch (err) { logControl('请求失败: ' + err.message); }
}

async function checkResultFile(taskId, stepId) {
    logControl('检查结果文件...');
    try {
        const data = await API.post('/api/flexrunner/check-result', { taskId: taskId, stepId: stepId });
        if (data.status === 'ok') {
            logControl('结果: ' + (data.success ? '成功' : '失败') + ' — ' + data.resultFilePath);
            if (data.content) showModal('结果文件', data.content);
        } else { logControl('失败: ' + data.error); }
    } catch (err) { logControl('请求失败: ' + err.message); }
}

async function refreshRunnerStatus(taskId, stepId) {
    try {
        const data = await API.get('/api/flexrunner/status?taskId=' + encodeURIComponent(taskId) + '&stepId=' + encodeURIComponent(stepId));
        if (data.status === 'ok') {
            toast('info', '状态已刷新');
            await loadTaskProgress(taskId);
        }
    } catch (err) { toast('error', err.message); }
}

async function saveStepConfig(stepId) {

        dependId: $('editDependId').value.trim(),

        failStepId: $('editFailStepId').value.trim(),
        maxRetries: parseInt($('editMaxRetries').value, 10) || 5,
        skillDirectory: $('editSkillDir').value.trim(),

// ═══════════════════════════════════════════════════════════════════
async function orchControl(action) {
    const taskId = State.selectedTaskId;
    if (!taskId) return;
    try {
        const data = await API.post('/api/orchestrator/' + action, { taskId: taskId });
        toast(data.status === 'ok' ? 'success' : 'error', data.message || action + ' 完成');
        await loadTaskProgress(taskId);
    } catch (err) { toast('error', err.message); }
}

// ═══════════════════════════════════════════════════════════════════
//  SSE Real-time Updates
// ═══════════════════════════════════════════════════════════════════
function connectSSE(taskId) {
    if (State.sseSource) {
        State.sseSource.close();
        State.sseSource = null;
    }
    try {
        const es = new EventSource('/stream/tasks/' + encodeURIComponent(taskId));
        State.sseSource = es;
        es.addEventListener('orch:step:status', function(e) {
            try {
                const data = JSON.parse(e.data);
                toast('info', '步骤 ' + data.stepId + ': ' + statusLabel(data.status));
                loadTaskProgress(taskId);
            } catch (err2) {}
        });
        es.addEventListener('orch:task:complete', function(e) {
            toast('success', '任务完成');
            loadTaskProgress(taskId);
            loadTaskList();
        });
        es.addEventListener('orch:task:error', function(e) {
            toast('error', '任务出错');
            loadTaskProgress(taskId);
            loadTaskList();
        });
        es.addEventListener('orch:task:aborted', function(e) {
            toast('warn', '任务已终止');
            loadTaskProgress(taskId);
            loadTaskList();
        });
        es.onerror = function() { /* silent */ };
    } catch (err) { /* SSE not available */ }
}

// ═══════════════════════════════════════════════════════════════════
//  Modal
// ═══════════════════════════════════════════════════════════════════
function showModal(title, content) {
    $('modalTitle').textContent = title;
    $('modalContent').textContent = content;
    $('modalOverlay').classList.add('show');
}
function closeModal() { $('modalOverlay').classList.remove('show'); }

// ═══════════════════════════════════════════════════════════════════
//  New Task Creation
// ═══════════════════════════════════════════════════════════════════
const NewTaskState = {
    mode: 'plan-and-execute',
    planResult: null,
    isPlanned: false,
};

function openNewTaskModal() {
    // Reset state
    NewTaskState.mode = 'plan-and-execute';
    NewTaskState.planResult = null;
    NewTaskState.isPlanned = false;
    $('newTaskDesc').value = '';
    $('newTaskCriteria').value = '';
    $('newTaskId').value = '';
    $('newTaskSkillDir').value = '';
    $('newTaskDir').value = '';
    $('decompPreview').style.display = 'none';
    $('decompPreview').innerHTML = '';
    $('advancedSection').classList.remove('show');
    $('advancedToggle').classList.remove('open');
    // Reset mode toggle
    document.querySelectorAll('.new-task-modal .mode-option').forEach(function(el) {
        el.classList.toggle('active', el.dataset.mode === 'plan-and-execute');
    });
    resetNewTaskFooter();
    $('newTaskOverlay').classList.add('show');
}

function closeNewTaskModal() {
    $('newTaskOverlay').classList.remove('show');
}

function resetNewTaskFooter() {
    $('newTaskFooter').innerHTML =
        '<button class="secondary" id="btnNewTaskCancel">取消</button>' +
        '<button class="primary" id="btnNewTaskSubmit">🚀 开始拆解</button>';
    $('btnNewTaskCancel').onclick = closeNewTaskModal;
    $('btnNewTaskSubmit').onclick = submitNewTask;
}

function submitNewTask() {
    const desc = $('newTaskDesc').value.trim();
    if (!desc) {
        toast('warn', '请输入任务描述');
        return;
    }
    const mode = NewTaskState.mode;
    const criteria = $('newTaskCriteria').value.trim();
    const taskId = $('newTaskId').value.trim() || undefined;
    const skillDir = $('newTaskSkillDir').value.trim() || undefined;
    const taskDir = $('newTaskDir').value.trim() || undefined;

    const body = { taskDescription: desc };
    if (criteria) body.acceptanceCriteria = criteria;
    if (taskId) body.taskId = taskId;
    if (skillDir) body.skillDirectory = skillDir;
    if (taskDir) body.taskDir = taskDir;

    // Show loading
    $('decompPreview').style.display = 'block';
    $('decompPreview').innerHTML =
        '<div class="decomp-loading"><div class="spinner"></div>Brain 正在拆解任务，请稍候...</div>';
    $('btnNewTaskSubmit').disabled = true;
    $('btnNewTaskSubmit').textContent = '⏳ 拆解中...';

    const endpoint = mode === 'plan-and-execute' ? '/api/brain/plan-and-execute' : '/api/brain/plan';
    API.post(endpoint, body).then(function(data) {
        $('btnNewTaskSubmit').disabled = false;
        if (data.status === 'ok' && data.plan) {
            NewTaskState.planResult = data.plan;
            NewTaskState.isPlanned = true;
            renderDecompositionPreview(data.plan, mode);
        } else if (data.status === 'ok' && data.taskId) {
            // plan-and-execute may return directly
            toast('success', '任务已创建并开始执行: ' + data.taskId);
            closeNewTaskModal();
            loadTaskList();
            selectTask(data.taskId);
        } else {
            toast('error', data.error || data.message || '拆解失败');
            $('decompPreview').innerHTML =
                '<div style="color:var(--red);padding:12px;font-size:12px;">拆解失败: ' +
                escapeHtml(data.error || data.message || '未知错误') + '</div>';
            $('btnNewTaskSubmit').textContent = '🚀 开始拆解';
        }
    }).catch(function(err) {
        $('btnNewTaskSubmit').disabled = false;
        $('btnNewTaskSubmit').textContent = '🚀 开始拆解';
        toast('error', '请求失败: ' + err.message);
        $('decompPreview').innerHTML =
            '<div style="color:var(--red);padding:12px;font-size:12px;">请求失败: ' +
            escapeHtml(err.message) + '</div>';
    });
}

function renderDecompositionPreview(plan, mode) {
    const taskDef = plan.taskDef || {};
    const steps = taskDef.steps || [];
    const taskId = plan.taskId || taskDef.taskId || '(自动生成)';
    const analysis = plan.analysis || {};

    let html = '<div class="form-group">';
    html += '<label>拆解结果</label>';
    html += '<div class="step-preview">';

    // Task info
    html += '<div style="margin-bottom:10px;padding:8px 10px;background:var(--blue-light);border-radius:5px;font-size:12px;">';
    html += '<strong>任务 ID:</strong> ' + escapeHtml(taskId) + '<br>';
    html += '<strong>领域:</strong> ' + escapeHtml(analysis.domain || '—') + ' | ';
    html += '<strong>复杂度:</strong> ' + escapeHtml(analysis.complexity || '—') + ' | ';
    html += '<strong>预计步骤:</strong> ' + (analysis.estimatedSteps || steps.length);
    html += '</div>';

    // Steps
    steps.forEach(function(step, idx) {
        const dependText = step.dependId && step.dependId !== '0' ? '依赖步骤 ' + step.dependId : '入口步骤';
        const nextText = step.nextStepId && step.nextStepId !== '0' ? '→ 步骤 ' + step.nextStepId : '→ 结束';
        const failText = step.failStepId && step.failStepId !== '0' ? ' | 失败→步骤 ' + step.failStepId : '';
        html += '<div class="preview-step">';
        html += '<div class="step-num">' + (idx + 1) + '</div>';
        html += '<div class="step-info">';
        html += '<div class="step-desc">' + escapeHtml(step.taskDescription || '') + '</div>';
        html += '<div class="step-meta">' + dependText + ' · ' + nextText + failText + ' · 重试' + (step.maxRetries || 3) + '次</div>';
        html += '</div>';
        html += '</div>';
    });

    html += '</div>';
    html += '</div>';

    // Acceptance criteria
    if (analysis.acceptanceCriteria && analysis.acceptanceCriteria.length > 0) {
        html += '<div class="form-group">';
        html += '<label>验收标准</label>';
        html += '<div class="step-preview">';
        analysis.acceptanceCriteria.forEach(function(ac, idx) {
            html += '<div class="preview-step">';
            html += '<div class="step-num" style="background:var(--green);">' + (idx + 1) + '</div>';
            html += '<div class="step-info">';
            html += '<div class="step-desc">' + escapeHtml(ac.criterion || '') + '</div>';
            html += '<div class="step-meta">类型: ' + escapeHtml(ac.type || '—') + '</div>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        html += '</div>';
    }

    $('decompPreview').innerHTML = html;

    // Update footer based on mode
    if (mode === 'plan-and-execute') {
        // Already executing — just close
        $('newTaskFooter').innerHTML =
            '<button class="secondary" id="btnNewTaskCancel">关闭</button>' +
            '<button class="success" id="btnNewTaskGo">📋 查看任务</button>';
        $('btnNewTaskCancel').onclick = closeNewTaskModal;
        $('btnNewTaskGo').onclick = function() {
            closeNewTaskModal();
            loadTaskList();
            selectTask(taskId);
        };
    } else {
        // Plan only — offer to execute
        $('newTaskFooter').innerHTML =
            '<button class="secondary" id="btnNewTaskCancel">取消</button>' +
            '<button class="secondary" id="btnNewTaskReplan">🔄 重新拆解</button>' +
            '<button class="success" id="btnNewTaskExecute">▶ 执行任务</button>';
        $('btnNewTaskCancel').onclick = closeNewTaskModal;
        $('btnNewTaskReplan').onclick = function() {
            NewTaskState.isPlanned = false;
            $('decompPreview').style.display = 'none';
            $('decompPreview').innerHTML = '';
            resetNewTaskFooter();
        };
        $('btnNewTaskExecute').onclick = function() { executePlannedTask(taskId); };
    }
}

async function executePlannedTask(taskId) {
    const btn = $('btnNewTaskExecute');
    btn.disabled = true;
    btn.textContent = '⏳ 启动中...';
    try {
        const data = await API.post('/api/orchestrator/load', NewTaskState.planResult.taskDef);
        if (data.status !== 'ok') {
            toast('error', data.error || '加载任务失败');
            btn.disabled = false;
            btn.textContent = '▶ 执行任务';
            return;
        }
        const startData = await API.post('/api/orchestrator/start', { taskId: taskId });
        if (startData.status === 'ok') {
            toast('success', '任务已启动: ' + taskId);
            closeNewTaskModal();
            loadTaskList();
            selectTask(taskId);
        } else {
            toast('error', startData.error || '启动失败');
            btn.disabled = false;
            btn.textContent = '▶ 执行任务';
        }
    } catch (err) {
        toast('error', '请求失败: ' + err.message);
        btn.disabled = false;
        btn.textContent = '▶ 执行任务';
    }
}

    $('advancedSection').classList.toggle('show');
    $('advancedToggle').classList.toggle('open');
};
document.querySelectorAll('.new-task-modal .mode-option').forEach(function(el) {
    el.onclick = function() {
        document.querySelectorAll('.new-task-modal .mode-option').forEach(function(e2) {
            e2.classList.remove('active');
        });
        el.classList.add('active');
        NewTaskState.mode = el.dataset.mode;
        // Reset preview if mode changes after planning
        if (NewTaskState.isPlanned) {
            NewTaskState.isPlanned = false;
            $('decompPreview').style.display = 'none';
            $('decompPreview').innerHTML = '';
            resetNewTaskFooter();
        }
    };
});
