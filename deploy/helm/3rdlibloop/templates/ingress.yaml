{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "3libloop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "3libloop.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: {{ (index .Values.services "gateway-svc").port }}
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: notify-svc
                port:
                  number: {{ (index .Values.services "notify-svc").port }}
{{- end }}
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "3libloop.fullname" . }}-orchestrator
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: orchestrator-svc
{{- end }}
