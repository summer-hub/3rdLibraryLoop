{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "3libloop.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "3libloop.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.autoscaling.agentRuntime.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-runtime-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "3libloop.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-runtime-svc
  minReplicas: {{ .Values.autoscaling.agentRuntime.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.agentRuntime.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.agentRuntime.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # 缩容更保守：会话是长任务，激进缩容会中断在途会话
      stabilizationWindowSeconds: 300
{{- end }}
